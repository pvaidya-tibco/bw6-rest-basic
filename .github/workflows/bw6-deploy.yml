name: BW6 Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TIBCO_HOME: C:\bw612
  MAVEN_REPO: C:/Users/pvaidya/.m2/repository
  JAVA_HOME: C:\bw612\tibcojre64\17

jobs:
  build-and-deploy-dev:
    name: "Build + Deploy to DEV"
    runs-on: self-hosted
    environment: dev

    steps:
      # Step 1 - Fix Git Ownership BEFORE Checkout
      - name: "Pre-cleanup Git safe directory"
        shell: pwsh
        run: |
          git config --global --add safe.directory '*'

      # Step 2 - Checkout repository
      - name: "Checkout source"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: .

      # Step 3 - Clear Maven cached resolution failures
      - name: "Clear Maven cached resolution failures"
        shell: pwsh
        run: |
          $repoPath = "${{ env.MAVEN_REPO }}/com/tibco"
          if (Test-Path $repoPath) {
            Get-ChildItem $repoPath -Recurse -Filter "*.lastUpdated" | Remove-Item -Force
            Write-Host "Cleared stale Maven cache markers in $repoPath"
          }

      # Step 4 - Build EAR and Deploy to DEV
      - name: "Build EAR and Deploy to DEV"
        shell: pwsh
        env:
          BW_PROFILE: WindowsProfileDev.substvar
          BWAGENT_HOST: guwdspwpvaidy01
          BWAGENT_PORT: 8079
          BW_DOMAIN: DevDomain
          BW_APPSPACE: DevAppSpace
          BW_APPNODE: DevAppNode
          BW_APPNODE_HTTP_PORT: 1530
          BW_DOC_API_PORT: 7777
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          $mvnRepo = $env:MAVEN_REPO
          & 'C:\apache-maven-3.9.8\bin\mvn.cmd' bw6:bwdeploy `
            -U `
            --batch-mode `
            --no-transfer-progress `
            "-Dmaven.repo.local=$mvnRepo" `
            -f 'tibco.bw.sample.binding.rest.Basic.application/pom.xml' `
            -DagentHost=$env:BWAGENT_HOST `
            -DagentPort=[int]$env:BWAGENT_PORT `
            -DagentSSL=false `
            -DdeployToAdmin=true `
            -Ddomain=$env:BW_DOMAIN `
            -DappSpace=$env:BW_APPSPACE `
            -DappNode=$env:BW_APPNODE `
            -DhttpPort=[int]$env:BW_APPNODE_HTTP_PORT `
            -Dredeploy=true `
            -DrestartAppNode=false `
            "-Dprofile=$env:BW_PROFILE" `
            "-DappNodeConfig_bw.rest.docApi.port_value=[int]$env:BW_DOC_API_PORT"

      # Step 5 - Verify DEV application is Running
      - name: "Verify DEV application is Running"
        shell: pwsh
        run: |
          $uri = "http://${{ env.BWAGENT_HOST }}:${{ env.BWAGENT_PORT }}/bw/v1/domains/${{ env.BW_DOMAIN }}/appspaces/${{ env.BW_APPSPACE }}/applications/tibco.bw.sample.binding.rest.Basic.application/1.0/status"
          $response = Invoke-RestMethod -Uri $uri -TimeoutSec 30
          Write-Host "Application state: $($response.state)"
          if ($response.state -eq "Running") {
            Write-Host "Application is Running"
          } else {
            Write-Error "Application NOT in Running state. Current state: $($response.state)"
            exit 1
          }

      # Step 6 - Upload EAR as workflow artifact
      - name: "Upload EAR as workflow artifact"
        uses: actions/upload-artifact@v4
        with:
          name: bw6-ear-${{ github.sha }}
          path: tibco.bw.sample.binding.rest.Basic.application/target/*.ear
          if-no-files-found: error
          retention-days: 7

  deploy-prod:
    name: "Deploy to PROD"
    needs: build-and-deploy-dev
    runs-on: self-hosted
    environment: prod

    steps:
      - name: "Pre-cleanup Git safe directory"
        shell: pwsh
        run: |
          git config --global --add safe.directory '*'

      - name: "Checkout source"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: .

      - name: "Clear Maven cached resolution failures"
        shell: pwsh
        run: |
          $repoPath = "${{ env.MAVEN_REPO }}/com/tibco"
          if (Test-Path $repoPath) {
            Get-ChildItem $repoPath -Recurse -Filter "*.lastUpdated" | Remove-Item -Force
          }

      - name: "Build EAR and Deploy to PROD"
        shell: pwsh
        env:
          BW_PROFILE: WindowsProfileProd.substvar
          BWAGENT_HOST: guwdspwpvaidy01
          BWAGENT_PORT: 8079
          BW_DOMAIN: ProdDomain
          BW_APPSPACE: ProdAppSpace
          BW_APPNODE: ProdAppNode
          BW_APPNODE_HTTP_PORT: 1530
          BW_DOC_API_PORT: 7777
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          $mvnRepo = $env:MAVEN_REPO
          & 'C:\apache-maven-3.9.8\bin\mvn.cmd' bw6:bwdeploy `
            -U `
            --batch-mode `
            --no-transfer-progress `
            "-Dmaven.repo.local=$mvnRepo" `
            -f 'tibco.bw.sample.binding.rest.Basic.application/pom.xml' `
            -DagentHost=$env:BWAGENT_HOST `
            -DagentPort=[int]$env:BWAGENT_PORT `
            -DagentSSL=false `
            -DdeployToAdmin=true `
            -Ddomain=$env:BW_DOMAIN `
            -DappSpace=$env:BW_APPSPACE `
            -DappNode=$env:BW_APPNODE `
            -DhttpPort=[int]$env:BW_APPNODE_HTTP_PORT `
            -Dredeploy=true `
            -DrestartAppNode=true `
            "-Dprofile=$env:BW_PROFILE" `
            "-DappNodeConfig_bw.rest.docApi.port_value=[int]$env:BW_DOC_API_PORT"

      - name: "Verify PROD application is Running"
        shell: pwsh
        run: |
          $uri = "http://${{ env.BWAGENT_HOST }}:${{ env.BWAGENT_PORT }}/bw/v1/domains/${{ env.BW_DOMAIN }}/appspaces/${{ env.BW_APPSPACE }}/applications/tibco.bw.sample.binding.rest.Basic.application/1.0/status"
          $response = Invoke-RestMethod -Uri $uri -TimeoutSec 30
          Write-Host "Application state: $($response.state)"
          if ($response.state -eq "Running") {
            Write-Host "PROD Application is Running"
          } else {
            Write-Error "PROD Application NOT in Running state. Current state: $($response.state)"
            exit 1
          }