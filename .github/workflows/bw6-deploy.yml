name: BW6 Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TIBCO_HOME: C:\bw612
  MAVEN_REPO: C:/Users/pvaidya/.m2/repository
  JAVA_HOME: C:\bw612\tibcojre64\17

jobs:
  build-and-deploy-dev:
    name: "Build + Deploy to DEV"
    runs-on: self-hosted
    environment: dev  # Pulls variables from the 'dev' environment

    steps:
      - name: "Step 1 - Pre-cleanup Git safe directory"
        shell: pwsh
        run: git config --global --add safe.directory '*'

      - name: "Step 2 - Checkout source"
        uses: actions/checkout@v4
        with:
          path: .

      - name: "Step 3 - Clear Maven cache"
        shell: pwsh
        run: |
          $repoPath = "${{ env.MAVEN_REPO }}/com/tibco"
          if (Test-Path $repoPath) {
            Get-ChildItem $repoPath -Recurse -Filter "*.lastUpdated" | Remove-Item -Force
          }

      - name: "Step 4 - Build EAR and Deploy to DEV"
        shell: pwsh
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          
          # Map GitHub environment variables to local PS variables
          $agentPort = [int]"${{ vars.BWAGENT_PORT }}".Trim()
          $httpPort  = [int]"${{ vars.BW_APPNODE_HTTP_PORT }}".Trim()
          $docApiPort = [int]"${{ vars.BW_DOC_API_PORT }}".Trim()

          & 'C:\apache-maven-3.9.8\bin\mvn.cmd' bw6:bwdeploy `
            -U --batch-mode --no-transfer-progress `
            "-Dmaven.repo.local=$env:MAVEN_REPO" `
            -f 'tibco.bw.sample.binding.rest.Basic.application/pom.xml' `
            "-DagentHost=${{ vars.BWAGENT_HOST }}" `
            "-DagentPort=$agentPort" `
            -DagentSSL=false `
            -DdeployToAdmin=true `
            "-Ddomain=${{ vars.BW_DOMAIN }}" `
            "-DappSpace=${{ vars.BW_APPSPACE }}" `
            "-DappNode=${{ vars.BW_APPNODE }}" `
            "-DhttpPort=$httpPort" `
            -Dredeploy=true `
            -DrestartAppNode=false `
            "-Dprofile=WindowsProfileDev.substvar" `
            "-DappNodeConfig_bw.rest.docApi.port_value=$docApiPort"

      - name: "Step 5 - Verify DEV application is Running"
        shell: pwsh
        run: |
          $uri = "http://${{ vars.BWAGENT_HOST }}:${{ vars.BWAGENT_PORT }}/bw/v1/domains/${{ vars.BW_DOMAIN }}/appspaces/${{ vars.BW_APPSPACE }}/applications/tibco.bw.sample.binding.rest.Basic.application/1.0/status"
          Write-Host "Checking URI: $uri"
          $response = Invoke-RestMethod -Uri $uri -TimeoutSec 30
          Write-Host "Application state: $($response.state)"
          if ($response.state -eq "Running") {
            Write-Host "Application is Running"
          } else {
            Write-Error "Application NOT in Running state. Current state: $($response.state)"
            exit 1
          }

      - name: "Step 6 - Upload EAR"
        uses: actions/upload-artifact@v4
        with:
          name: bw6-ear-${{ github.sha }}
          path: tibco.bw.sample.binding.rest.Basic.application/target/*.ear

  deploy-prod:
    name: "Deploy to PROD"
    needs: build-and-deploy-dev
    runs-on: self-hosted
    environment: prod  # Pulls variables from the 'prod' environment

    steps:
      - name: "Step 1 - Pre-cleanup"
        shell: pwsh
        run: git config --global --add safe.directory '*'

      - name: "Step 2 - Checkout"
        uses: actions/checkout@v4
        with:
          path: .

      - name: "Step 3 - Clear Maven cache"
        shell: pwsh
        run: |
          $repoPath = "${{ env.MAVEN_REPO }}/com/tibco"
          if (Test-Path $repoPath) {
            Get-ChildItem $repoPath -Recurse -Filter "*.lastUpdated" | Remove-Item -Force
          }

      - name: "Step 4 - Build EAR and Deploy to PROD"
        shell: pwsh
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          
          # Map GitHub environment variables to local PS variables
          $agentPort = [int]"${{ vars.BWAGENT_PORT }}".Trim()
          $httpPort  = [int]"${{ vars.BW_APPNODE_HTTP_PORT }}".Trim()
          $docApiPort = [int]"${{ vars.BW_DOC_API_PORT }}".Trim()

          & 'C:\apache-maven-3.9.8\bin\mvn.cmd' bw6:bwdeploy `
            -U --batch-mode --no-transfer-progress `
            "-Dmaven.repo.local=$env:MAVEN_REPO" `
            -f 'tibco.bw.sample.binding.rest.Basic.application/pom.xml' `
            "-DagentHost=${{ vars.BWAGENT_HOST }}" `
            "-DagentPort=$agentPort" `
            -DagentSSL=false `
            -DdeployToAdmin=true `
            "-Ddomain=${{ vars.BW_DOMAIN }}" `
            "-DappSpace=${{ vars.BW_APPSPACE }}" `
            "-DappNode=${{ vars.BW_APPNODE }}" `
            "-DhttpPort=$httpPort" `
            -Dredeploy=true `
            -DrestartAppNode=true `
            "-Dprofile=WindowsProfileProd.substvar" `
            "-DappNodeConfig_bw.rest.docApi.port_value=$docApiPort"

      - name: "Step 5 - Verify PROD application is Running"
        shell: pwsh
        run: |
          $uri = "http://${{ vars.BWAGENT_HOST }}:${{ vars.BWAGENT_PORT }}/bw/v1/domains/${{ vars.BW_DOMAIN }}/appspaces/${{ vars.BW_APPSPACE }}/applications/tibco.bw.sample.binding.rest.Basic.application/1.0/status"
          $response = Invoke-RestMethod -Uri $uri -TimeoutSec 30
          Write-Host "Application state: $($response.state)"
          if ($response.state -eq "Running") {
            Write-Host "PROD Application is Running"
          } else {
            Write-Error "PROD Application NOT in Running state. Current state: $($response.state)"
            exit 1
          }